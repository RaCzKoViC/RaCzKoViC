name: Update profile telemetry
on:
  push:
    paths:
      - scripts/generate_stats.py
      - .github/workflows/update-profile.yml
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update public GitHub telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py
      - name: Commit refreshed card
        run: |
          if git diff --quiet -- assets/github-stats.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git commit -m "chore(profile): refresh public statistics"
          git push
