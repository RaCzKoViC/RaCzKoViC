name: Update profile telemetry
on:
  push:
  repository_dispatch:
    types: [code_changed, project_changed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate telemetry rules
        run: python -m unittest discover -s tests
      - name: Update public GitHub telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py
      - name: Commit refreshed profile
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh public statistics"
          git push
